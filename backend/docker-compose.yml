version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nsrc
      POSTGRES_PASSWORD: nsrc
      POSTGRES_DB: nsrc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsrc"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    volumes:
      - ./:/app
      - storage:/data/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    command: celery -A app.utils.celery_app.celery_app worker --loglevel=info
    volumes: [./:/app, storage:/data/storage]

  beat:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    command: celery -A app.utils.celery_app.celery_app beat --loglevel=info
    volumes: [./:/app]

  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    depends_on: [postgres]

volumes:
  pgdata:
  storage:
